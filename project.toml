# tr02: Tomb Raider II, the Steam release's Tomb2.exe (linked 1997-12-10)

[game]
name = "tomb2"
title = "Tomb Raider II"
window_title = "Tomb Raider II"
dir = "orig/tomb2"
exe = "Tomb2.exe"
checksums = "orig/tomb2.sha1"
original = "build/orig/tomb2.exe"
game_end = 0x459030  # phd_sqrt, the 3DSYSTEM assembly, is last; the CRT follows

[ghidra]
project = "tomb2"
search = ["~/data.local/work/ghidra_*"]

[build]
# TOMBRAID.DSP's release flags, without /Zi /Fr /YX /FD
cflags = ["/G5", "/Zp1", "/W3", "/O2", "/DNDEBUG", "/DWIN32", "/D_WINDOWS"]
crlf = true  # Core's sources had DOS line endings
bin = 'C:\msvc5sp3\bin'  # Visual C++ 5.0 with Service Pack 3
include = ['C:\dx5\include', 'C:\msvc5sp3\include']
lib = ['C:\dx5\lib', 'C:\msvc5sp3\lib']

[exe]
defines = ["TR2_EXE=1"]
# The original's import order is TOMBRAID.DSP's library order.
libs = ["dxguid.lib", "dinput.lib", "dsound.lib", "ddraw.lib", "winmm.lib", "user32.lib",
        "comctl32.lib", "advapi32.lib", "gdi32.lib", "winplay.lib", "ole32.lib", "libc.lib",
        "kernel32.lib"]

[symbols]
manifest = "refs/trx/docs/symbols/tr2-steam.txt"

[hooks]
progress = true  # every commit redraws docs/progress.svg
compare = true  # every compiled function matches the original
one_function = true  # one newly matching function per commit
pairs = false  # revoked: groups land one per commit with DECOMP_ALLOW_DIFF
no_comments = true  # no comments, tabs or CRs in src/
allow_diff = ["calc_roomvert", "InsertGT3_Sorted", "InsertGT4_Sorted", "ins_poly_trans8", "phd_RotX", "CreateSaveGameInfo", "BoatControl", "ClipRoom", "ScreenShot", "InsertGT3_ZBuffered", "Func402620", "Func444350", "DrawXianLord", "AdjustTextureUVs", "S_GetObjectBounds", "HairControl", "BGND_AddTexture", "TranslateItem", "DragonControl", "DrawAssaultTimer", "PrintObjects", "S_SaveSettings", "xgen_xg", "phd_RotY", "phd_RotYXZ", "phd_RotYXZpack", "phd_TranslateRel", "phd_TranslateAbs", "visible_zclip", "GetCollisionInfo", "ShiftItem", "GetRoomBounds", "SkidooControl", "SkidmanPush", "SkidManControl", "ShowEndStatsText", "Func4524e0", "SE_SoundDlgInit", "SE_ControlsDlgInit", "SE_AdvancedDlgUpdate", "SE_LoadBitmapResource", "GetTextScaleV", "lara_col_climbing", "EncodePutPCX", "InsertTrans8_Sorted", "CopyBitmapPalette", "WinVidGetDisplayAdapters", "phd_RotYXZsuperpack", "LoadTexturePage", "SE_AdvancedDlgProc", "S_CalculateStaticMeshLight", "SE_GraphicsDlgInit", "AddTexturePage16", "calc_vertice_light", "calc_object_vertices", "DrawClippedPoly_Textured", "InsertClippedPoly_Textured", "EnumDisplayAdaptersCallback", "SE_GraphicsDlgFullScreenModesUpdate", "SE_GraphicsDlgProc", "RenderStart", "InsertObjectG3_Sorted", "InsertGT4_ZBuffered", "InsertObjectG3_ZBuffered", "InsertObjectG4_ZBuffered", "InsertObjectG4_Sorted", "ObjectOnLOS", "S_CalculateLight", "SE_GraphicsDlgUpdate", "LookCamera", "draw_scaled_spriteC", "PuzzleHoleCollision", "DetonatorCollision", "LaraGun", "S_DrawSprite", "PickUpCollision", "WinVidFreeWindow", "WinSndFinish"]  # logically equivalent, registers or term order differ

[remote]
host = "desktop"  # the Windows desktop, for rpermute.py
root = "C:/Users/mkurc/@/tr02-agent"
python = '"%USERPROFILE%\AppData\Local\Programs\Python\Python312\python.exe"'

[reference]
source = "refs/core"  # Core's 1997 tree
prefer = ["BACKUP"]  # closer to TR2 than GAME/, which drifts toward TR3
skip = ["GAME/GAMEBAK", "GAME/GAMEBAK2"]
layout = { GAME = "", BACKUP = "", SPECIFIC = "specific", 3DSYSTEM = "3dsystem" }
dsp = "TOMBRAID.DSP"
dsp_config = "TombRaid - Win32 Release"
defines = ["/DCODER=0"]
probe = "build/core_probe.csv"
